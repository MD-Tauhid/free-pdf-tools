services:
  conversion-worker:
    build:
      context: .
      dockerfile: worker/conversion/Dockerfile
    environment:
      PORT: "8080"
      WORKER_API_TOKEN: ${CONVERSION_WORKER_TOKEN:?Set CONVERSION_WORKER_TOKEN in the root .env file}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
